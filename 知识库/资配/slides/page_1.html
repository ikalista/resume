<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>资配订单智能匹配优化方案</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><style>
        body {width: 1280px; min-height: 720px; margin: 0;
            padding: 0;}
        .slide {
            width: 1280px;
            min-height: 720px;
        }
        .network-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: rgba(59, 130, 246, 0.5);
            border-radius: 50%;
        }
        .line {
            position: absolute;
            height: 1px;
            background-color: rgba(59, 130, 246, 0.3);
            transform-origin: left center;
        }
    </style>
</head>
<body>
<div class="slide bg-gradient-to-br from-gray-900 to-blue-900 relative flex items-center justify-center">
<!-- Abstract network visualization background -->
<div class="network-bg" id="network"></div>
<!-- Content overlay -->
<div class="z-10 text-center px-16">
<div class="mb-4 inline-block">
<div class="w-24 h-1 bg-orange-500 mx-auto mb-6"></div>
<h1 class="text-5xl font-bold text-white tracking-wide mb-6">资配订单智能匹配优化方案</h1>
<div class="w-24 h-1 bg-orange-500 mx-auto mt-6"></div>
</div>
<h2 class="text-2xl text-blue-200 font-light mb-12">基于二分图与机器学习，提升资金分配效率</h2>
<div class="flex justify-center items-center mt-16">
<div class="flex items-center bg-blue-800 bg-opacity-50 px-8 py-3 rounded-lg border border-blue-700">
<i class="fas fa-calendar-alt text-blue-300 mr-3"></i>
<p class="text-blue-100">报告生成日期: 2025-07-18</p>
</div>
</div>
<div class="absolute bottom-12 right-12 flex items-center">
<div class="h-10 w-10 rounded-full bg-blue-600 flex items-center justify-center mr-3">
<i class="fas fa-chart-line text-white text-lg"></i>
</div>
<div class="h-10 w-10 rounded-full bg-orange-500 flex items-center justify-center mr-3">
<i class="fas fa-project-diagram text-white text-lg"></i>
</div>
<div class="h-10 w-10 rounded-full bg-blue-400 flex items-center justify-center">
<i class="fas fa-brain text-white text-lg"></i>
</div>
</div>
</div>
</div>
<script>
        // Create network visualization
        const network = document.getElementById('network');
        const numDots = 40;
        const numLines = 60;
        
        // Create dots
        for (let i = 0; i < numDots; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            
            // Position randomly
            const x = Math.random() * 1280;
            const y = Math.random() * 720;
            
            dot.style.left = `${x}px`;
            dot.style.top = `${y}px`;
            
            // Vary the size slightly
            const size = 2 + Math.random() * 4;
            dot.style.width = `${size}px`;
            dot.style.height = `${size}px`;
            
            // Left side dots are orange (representing orders)
            if (x < 640) {
                dot.style.backgroundColor = `rgba(249, 115, 22, ${0.3 + Math.random() * 0.4})`;
            }
            // Right side dots are blue (representing funding sources)
            else {
                dot.style.backgroundColor = `rgba(59, 130, 246, ${0.3 + Math.random() * 0.4})`;
            }
            
            network.appendChild(dot);
        }
        
        // Create connecting lines
        const dots = document.querySelectorAll('.dot');
        for (let i = 0; i < numLines; i++) {
            // Get two random dots to connect
            const dot1Index = Math.floor(Math.random() * dots.length);
            let dot2Index;
            
            // Make sure connections are between left and right sides
            if (parseFloat(dots[dot1Index].style.left) < 640) {
                // If dot1 is on left, find a dot on right
                do {
                    dot2Index = Math.floor(Math.random() * dots.length);
                } while (parseFloat(dots[dot2Index].style.left) < 640);
            } else {
                // If dot1 is on right, find a dot on left
                do {
                    dot2Index = Math.floor(Math.random() * dots.length);
                } while (parseFloat(dots[dot2Index].style.left) >= 640);
            }
            
            const dot1 = dots[dot1Index];
            const dot2 = dots[dot2Index];
            
            // Calculate line properties
            const x1 = parseFloat(dot1.style.left) + parseFloat(dot1.style.width) / 2;
            const y1 = parseFloat(dot1.style.top) + parseFloat(dot1.style.height) / 2;
            const x2 = parseFloat(dot2.style.left) + parseFloat(dot2.style.width) / 2;
            const y2 = parseFloat(dot2.style.top) + parseFloat(dot2.style.height) / 2;
            
            const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
            
            // Create line
            const line = document.createElement('div');
            line.classList.add('line');
            line.style.width = `${length}px`;
            line.style.left = `${x1}px`;
            line.style.top = `${y1}px`;
            line.style.transform = `rotate(${angle}deg)`;
            line.style.opacity = 0.2 + Math.random() * 0.3;
            
            network.appendChild(line);
        }
    </script>

</body></html>
