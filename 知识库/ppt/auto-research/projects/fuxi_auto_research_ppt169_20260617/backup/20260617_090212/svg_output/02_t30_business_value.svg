<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#00A884"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565C0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00A884"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F7FAFC"/>
    <rect x="0" y="0" width="1280" height="116" fill="#FFFFFF"/>
    <rect x="48" y="104" width="1184" height="1" fill="#D8E1EA"/>
  </g>

  <g id="header">
    <rect x="48" y="38" width="8" height="44" rx="4" fill="url(#titleGradient)"/>
    <text x="70" y="63" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="36" font-weight="700" fill="#0B1F33">外诉 T30 场景：更快建模，更精细处置</text>
    <text x="70" y="92" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" fill="#6B7280">通话后实时预测外诉风险，高风险补钱降外诉，低风险降本控成本</text>
  </g>

  <g id="business-loop">
    <rect x="48" y="136" width="1184" height="184" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1.2"/>
    <text x="74" y="166" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="700" fill="#1565C0">通话后实时预测闭环</text>

    <g id="loop-step-call">
      <rect x="74" y="194" width="168" height="78" rx="8" fill="#E8F2FF" stroke="#1565C0" stroke-width="1.4"/>
      <use data-icon="phosphor-duotone/phone-call" x="94" y="216" width="32" height="32" fill="#1565C0"/>
      <text x="140" y="225" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#0B1F33">通话结束</text>
      <text x="140" y="249" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280">实时触发预测</text>
    </g>

    <g id="loop-step-risk">
      <rect x="300" y="194" width="168" height="78" rx="8" fill="#FDECEC" stroke="#E55353" stroke-width="1.4"/>
      <use data-icon="phosphor-duotone/shield-warning" x="320" y="216" width="32" height="32" fill="#E55353"/>
      <text x="366" y="225" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#0B1F33">识别外诉风险</text>
      <text x="366" y="249" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280">T30 是否外诉</text>
    </g>

    <g id="loop-step-high">
      <rect x="526" y="178" width="190" height="62" rx="8" fill="#FDECEC" stroke="#E55353" stroke-width="1.2"/>
      <use data-icon="phosphor-duotone/currency-cny" x="548" y="194" width="28" height="28" fill="#E55353"/>
      <text x="590" y="204" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#0B1F33">高风险人群</text>
      <text x="590" y="226" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280">补钱 / 强化安抚</text>
    </g>

    <g id="loop-step-low">
      <rect x="526" y="254" width="190" height="42" rx="8" fill="#E8F8F2" stroke="#00A884" stroke-width="1.2"/>
      <text x="548" y="280" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#0B1F33">低风险人群</text>
      <text x="654" y="280" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280">标准处置 / 降本</text>
    </g>

    <g id="loop-step-result">
      <rect x="810" y="194" width="190" height="78" rx="8" fill="#E8F8F2" stroke="#00A884" stroke-width="1.4"/>
      <use data-icon="phosphor-duotone/trend-up" x="832" y="216" width="32" height="32" fill="#00A884"/>
      <text x="878" y="225" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#0B1F33">精细化处置</text>
      <text x="878" y="249" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280">收益与成本分层</text>
    </g>

    <g id="loop-step-goal">
      <rect x="1060" y="194" width="146" height="78" rx="8" fill="#0B1F33"/>
      <text x="1133" y="226" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">降低外诉率</text>
      <text x="1133" y="250" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#D8E1EA" text-anchor="middle">同时控制补贴成本</text>
    </g>

    <line x1="242" y1="233" x2="294" y2="233" stroke="#1565C0" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <line x1="468" y1="233" x2="520" y2="209" stroke="#E55353" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <line x1="468" y1="233" x2="520" y2="274" stroke="#00A884" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <line x1="716" y1="209" x2="804" y2="222" stroke="#E55353" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <line x1="716" y1="276" x2="804" y2="244" stroke="#00A884" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <line x1="1000" y1="233" x2="1054" y2="233" stroke="#00A884" stroke-width="3" marker-end="url(#arrowGreen)"/>
  </g>

  <g id="chartArea">
    <rect x="48" y="348" width="772" height="296" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1.2"/>
    <text x="74" y="378" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="700" fill="#1565C0">建模周期对比：传统流程 vs 伏羲 Auto-Research</text>
    <!-- chart-plot-area: 244,418,724,578 -->

    <g id="x-axis">
      <line x1="244" y1="578" x2="724" y2="578" stroke="#D8E1EA" stroke-width="1"/>
      <line x1="244" y1="418" x2="244" y2="578" stroke="#D8E1EA" stroke-width="1"/>
      <line x1="484" y1="418" x2="484" y2="578" stroke="#D8E1EA" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="724" y1="418" x2="724" y2="578" stroke="#D8E1EA" stroke-width="1"/>
      <text x="244" y="606" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280" text-anchor="middle">0 天</text>
      <text x="484" y="606" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280" text-anchor="middle">5 天</text>
      <text x="724" y="606" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280" text-anchor="middle">10 天</text>
    </g>

    <g id="row-data">
      <text x="216" y="427" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#0B1F33" text-anchor="end">数据准备</text>
      <line x1="724" y1="422" x2="724" y2="422" stroke="#D8E1EA" stroke-width="3"/>
      <circle cx="724" cy="422" r="8" fill="#1565C0"/>
      <circle cx="724" cy="422" r="8" fill="#00A884"/>
      <text x="746" y="427" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#6B7280">10 天持平</text>
    </g>

    <g id="row-feature">
      <text x="216" y="503" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#0B1F33" text-anchor="end">特征工程</text>
      <line x1="292" y1="498" x2="340" y2="498" stroke="#D8E1EA" stroke-width="3"/>
      <circle cx="340" cy="498" r="8" fill="#1565C0"/>
      <circle cx="292" cy="498" r="8" fill="#00A884"/>
      <text x="362" y="503" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#6B7280">2 → 1 天</text>
      <text x="430" y="503" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="700" fill="#00A884">压缩 50%</text>
    </g>

    <g id="row-model">
      <text x="216" y="569" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" font-weight="700" fill="#0B1F33" text-anchor="end">模型工程</text>
      <line x1="292" y1="564" x2="340" y2="564" stroke="#D8E1EA" stroke-width="3"/>
      <circle cx="340" cy="564" r="8" fill="#1565C0"/>
      <circle cx="292" cy="564" r="8" fill="#00A884"/>
      <text x="362" y="569" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" fill="#6B7280">2 → 1 天</text>
      <text x="430" y="569" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="700" fill="#00A884">压缩 50%</text>
    </g>

    <g id="legend">
      <circle cx="610" cy="378" r="6" fill="#1565C0"/>
      <text x="624" y="383" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280">传统</text>
      <circle cx="676" cy="378" r="6" fill="#00A884"/>
      <text x="690" y="383" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280">伏羲</text>
    </g>
  </g>

  <g id="kpi-panel">
    <rect x="846" y="348" width="386" height="296" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1.2"/>
    <text x="872" y="378" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="700" fill="#1565C0">直接收益</text>

    <g id="kpi-total">
      <rect x="872" y="404" width="154" height="104" rx="8" fill="#E8F8F2"/>
      <text x="949" y="448" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="52" font-weight="700" fill="#00A884" text-anchor="middle">2</text>
      <text x="949" y="478" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#0B1F33" text-anchor="middle">整体节省天数</text>
    </g>

    <g id="kpi-stage">
      <rect x="1050" y="404" width="154" height="104" rx="8" fill="#E8F2FF"/>
      <text x="1127" y="448" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="52" font-weight="700" fill="#1565C0" text-anchor="middle">50%</text>
      <text x="1127" y="478" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#0B1F33" text-anchor="middle">特征 / 模型压缩</text>
    </g>

    <g id="kpi-explain">
      <rect x="872" y="532" width="332" height="74" rx="8" fill="#0B1F33"/>
      <text x="896" y="560" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="17" font-weight="700" fill="#FFFFFF">业务含义</text>
      <text x="896" y="586" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#D8E1EA">
        <tspan x="896" dy="0">更快上线预测模型，支持更早分层干预；</tspan>
        <tspan x="896" dy="22">补贴投向高风险人群，低风险人群减少成本。</tspan>
      </text>
    </g>
  </g>

  <g id="footer">
    <text x="48" y="704" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280">Source: 内部业务场景说明；周期口径为数据准备、特征工程、模型工程估算</text>
    <text x="1232" y="704" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="12" fill="#6B7280" text-anchor="end">02 / 02</text>
  </g>
</svg>
