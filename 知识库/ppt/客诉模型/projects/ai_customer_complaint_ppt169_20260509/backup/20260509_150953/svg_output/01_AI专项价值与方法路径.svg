<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="topRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#00A6A6"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4A90A4"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00A6A6"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
    <rect x="0" y="0" width="1280" height="7" fill="url(#topRule)"/>
  </g>

  <g id="header">
    <text x="44" y="52" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="34" font-weight="700" fill="#172033">AI专项要形成“识别—分类—策略—反馈”的业务闭环</text>
    <text x="44" y="82" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#667085">从客户通话与工单数据出发，把模型判断转化为外诉压降和退费处置动作</text>
  </g>

  <g id="takeaway">
    <rect x="44" y="104" width="1192" height="52" rx="8" fill="#1E3A5F"/>
    <text x="68" y="137" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="20" font-weight="700" fill="#FFFFFF">核心结论：AI 的价值不在单点分类，而在同时压降外诉、优化退费、沉淀专家经验</text>
  </g>

  <g id="pipeline-links">
    <line x1="253" y1="296" x2="292" y2="296" stroke="#4A90A4" stroke-width="3" marker-end="url(#arrowHead)"/>
    <line x1="473" y1="296" x2="512" y2="296" stroke="#4A90A4" stroke-width="3" marker-end="url(#arrowHead)"/>
    <line x1="693" y1="296" x2="732" y2="296" stroke="#4A90A4" stroke-width="3" marker-end="url(#arrowHead)"/>
    <line x1="913" y1="296" x2="952" y2="296" stroke="#4A90A4" stroke-width="3" marker-end="url(#arrowHead)"/>
  </g>

  <g id="stage-phone">
    <rect x="44" y="198" width="209" height="196" rx="8" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
    <rect x="44" y="198" width="209" height="8" rx="4" fill="#1E3A5F"/>
    <use data-icon="chunk-filled/phone" x="64" y="224" width="34" height="34" fill="#1E3A5F"/>
    <text x="110" y="250" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#172033">电话</text>
    <text x="64" y="292" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#667085">
      <tspan x="64" dy="0">通话文本、12378拨打</tspan>
      <tspan x="64" dy="26">工单、短信触达</tspan>
      <tspan x="64" dy="26">退费与投诉结果</tspan>
    </text>
    <text x="64" y="371" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="700" fill="#1E3A5F">输入：多源客户行为数据</text>
  </g>

  <g id="stage-model">
    <rect x="292" y="198" width="181" height="196" rx="8" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
    <rect x="292" y="198" width="181" height="8" rx="4" fill="#00A6A6"/>
    <use data-icon="chunk-filled/bolt" x="312" y="224" width="34" height="34" fill="#00A6A6"/>
    <text x="358" y="250" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#172033">大模型</text>
    <text x="312" y="292" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#667085">
      <tspan x="312" dy="0">嵌入专家经验</tspan>
      <tspan x="312" dy="26">规则下钻和聚类并行</tspan>
      <tspan x="312" dy="26">多基座交叉验证</tspan>
    </text>
    <text x="312" y="371" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="700" fill="#00A6A6">能力：可解释判断</text>
  </g>

  <g id="stage-behavior">
    <rect x="512" y="198" width="181" height="196" rx="8" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
    <rect x="512" y="198" width="181" height="8" rx="4" fill="#4A90A4"/>
    <use data-icon="chunk-filled/target" x="532" y="224" width="34" height="34" fill="#4A90A4"/>
    <text x="578" y="250" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#172033">行为识别</text>
    <text x="532" y="292" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#667085">
      <tspan x="532" dy="0">投诉倾向</tspan>
      <tspan x="532" dy="26">外溢风险</tspan>
      <tspan x="532" dy="26">诉求强度和沟通方式</tspan>
    </text>
    <text x="532" y="371" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="700" fill="#4A90A4">输出：风险与诉求信号</text>
  </g>

  <g id="stage-segment">
    <rect x="732" y="198" width="181" height="196" rx="8" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
    <rect x="732" y="198" width="181" height="8" rx="4" fill="#1F8A70"/>
    <use data-icon="chunk-filled/users" x="752" y="224" width="34" height="34" fill="#1F8A70"/>
    <text x="798" y="250" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#172033">客群分类</text>
    <text x="752" y="292" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#667085">
      <tspan x="752" dy="0">小白、豆包、专业型</tspan>
      <tspan x="752" dy="26">强硬、协商、软弱型</tspan>
      <tspan x="752" dy="26">保留等待挖掘维度</tspan>
    </text>
    <text x="752" y="371" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="700" fill="#1F8A70">标签：双轴人群画像</text>
  </g>

  <g id="stage-strategy">
    <rect x="952" y="198" width="284" height="196" rx="8" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
    <rect x="952" y="198" width="284" height="8" rx="4" fill="#D04A02"/>
    <use data-icon="chunk-filled/shield-check" x="972" y="224" width="34" height="34" fill="#D04A02"/>
    <text x="1018" y="250" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="22" font-weight="700" fill="#172033">处置策略</text>
    <text x="972" y="292" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="15" fill="#667085">
      <tspan x="972" dy="0">分流建议、外呼话术、退费力度</tspan>
      <tspan x="972" dy="26">拒绝方式、跟进周期、专项组高亮</tspan>
      <tspan x="972" dy="26">处置结果反哺模型</tspan>
    </text>
    <text x="972" y="371" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="13" font-weight="700" fill="#D04A02">动作：从判断到执行</text>
  </g>

  <g id="feedback-loop">
    <path d="M 1094,404 C 1094,466 682,468 382,444 C 216,431 180,418 150,398" fill="none" stroke="#00A6A6" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowAccent)"/>
    <use data-icon="chunk-filled/arrows-rotate-clockwise" x="585" y="429" width="28" height="28" fill="#00A6A6"/>
    <rect x="624" y="426" width="170" height="34" rx="17" fill="#E8F7F7" stroke="#00A6A6" stroke-width="1"/>
    <text x="709" y="449" text-anchor="middle" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" font-weight="700" fill="#00A6A6">结果反馈形成闭环</text>
  </g>

  <g id="value-mapping">
    <rect x="44" y="494" width="1192" height="132" rx="8" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="1.5"/>
    <text x="68" y="526" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="18" font-weight="700" fill="#172033">价值映射</text>
    <line x1="68" y1="544" x2="1212" y2="544" stroke="#D9E2EC" stroke-width="1"/>

    <g id="value-complaint">
      <rect x="68" y="566" width="342" height="42" rx="6" fill="#EAF0F6"/>
      <text x="86" y="593" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#1E3A5F">压降外诉</text>
      <text x="180" y="593" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#667085">提前识别高风险客户，抢在外溢前干预</text>
    </g>

    <g id="value-refund">
      <rect x="452" y="566" width="342" height="42" rx="6" fill="#E8F7F7"/>
      <text x="470" y="593" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#00A6A6">退费优化</text>
      <text x="564" y="593" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#667085">区分可谈、必赔、拒绝、拉长周期</text>
    </g>

    <g id="value-knowledge">
      <rect x="836" y="566" width="376" height="42" rx="6" fill="#FFF4ED"/>
      <text x="854" y="593" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="16" font-weight="700" fill="#D04A02">经验沉淀</text>
      <text x="948" y="593" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="14" fill="#667085">专家经验、Top问题、Top话术持续训练模型</text>
    </g>
  </g>

  <g id="footer">
    <text x="44" y="690" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#98A2B3">AI客诉专项 | Source: 智能纪要与架构草图整理</text>
    <text x="1236" y="690" text-anchor="end" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif' font-size="11" fill="#98A2B3">01 / 02</text>
  </g>
</svg>
